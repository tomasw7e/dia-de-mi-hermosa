<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Universo ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010107;color:#fff;font-family:Arial,Helvetica,sans-serif}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 43%,#21051f 0,#09000d 32%,#010107 75%)}
canvas{position:absolute;inset:0;width:100%;height:100%}


.panel{
 position:absolute;z-index:100;left:50%;top:35%;transform:translate(-50%,-50%);
 width:min(350px,82vw);padding:22px 20px;text-align:center;
 border:1px solid #ff4d9d;border-radius:10px;background:rgba(9,1,12,.92);
 box-shadow:0 0 35px rgba(255,35,145,.3),inset 0 0 30px rgba(255,35,145,.07);
}
.panel h1{font-size:16px;line-height:1.25;margin:9px 0 16px}
.heartMini{font-size:32px;color:#ff5ba8;text-shadow:0 0 18px #ff278b;animation:pulse 1.2s infinite}
button{border:1px solid #ff55a5;background:linear-gradient(#ff519d,#d8006e);color:white;border-radius:22px;padding:10px 20px;font-size:9px;font-weight:bold;cursor:pointer;box-shadow:0 0 15px #ff2484}
button:hover{filter:brightness(1.15)}
#loader{display:none}
.bar{height:5px;background:#321126;border-radius:5px;overflow:hidden}
.bar i{display:block;width:0;height:100%;background:#ff4b9e;box-shadow:0 0 12px #ff4b9e}
.loadtxt{font-size:10px;margin-bottom:10px}

#scene{position:absolute;inset:0;opacity:0;transition:opacity 1s;pointer-events:none}
#scene.on{opacity:1;pointer-events:auto}
#keyboard{
 position:absolute;left:-5%;right:-5%;bottom:-5%;height:24%;
 transform:perspective(650px) rotateX(58deg);transform-origin:bottom;
 background:repeating-linear-gradient(90deg,transparent 0 4.6%,rgba(0,160,255,.35) 4.8% 5%),
 repeating-linear-gradient(0deg,transparent 0 11%,rgba(0,160,255,.32) 11.3% 11.7%);
 box-shadow:0 -15px 45px rgba(0,120,255,.3);opacity:.65
}

#core{position:absolute;left:50%;top:48%;width:220px;height:220px;transform:translate(-50%,-50%);z-index:30}
.coreGlow{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(255,40,160,.22),transparent 67%);filter:blur(9px)}
.heart3d{
 position:absolute;left:50%;top:50%;width:82px;height:76px;
 transform:translate(-50%,-43%) rotate(-45deg);
 background:linear-gradient(145deg,#ffb0dc 0%,#ff4da5 28%,#a90060 70%,#4b003b 100%);
 border-radius:10px 0 10px 0;
 box-shadow:-8px 10px 0 #7c004d,0 0 20px #ff42a5,0 0 45px rgba(255,42,160,.7);
 animation:heartBeat 1.7s infinite;
 cursor:pointer;
}
.heart3d:before,.heart3d:after{
 content:"";position:absolute;width:82px;height:82px;border-radius:50%;
 background:inherit;box-shadow:inherit
}
.heart3d:before{top:-41px;left:0}.heart3d:after{left:41px;top:0}
.heartshine{position:absolute;z-index:3;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-45deg);width:18px;height:9px;border-radius:50%;background:#fff;filter:blur(1px);opacity:.75}
.coreTitle{position:absolute;left:50%;top:76%;transform:translateX(-50%);width:180px;text-align:center;font-weight:bold;font-size:11px;letter-spacing:2px;color:#ffe0f1;text-shadow:0 0 10px #ff4aa7}
.coreSub{position:absolute;left:50%;top:83%;transform:translateX(-50%);width:210px;text-align:center;font-size:6px;color:#f7cce3;letter-spacing:.7px}


#memories{position:absolute;inset:0;z-index:20}
#decor{position:absolute;inset:0;z-index:9;pointer-events:none}
.orbit{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);border:1px solid rgba(255,100,185,.22);border-radius:50%;box-shadow:0 0 18px rgba(255,50,160,.07)}
.orbit.a{width:380px;height:180px;transform:translate(-50%,-50%) rotate(-12deg)}
.orbit.b{width:570px;height:270px;transform:translate(-50%,-50%) rotate(14deg)}
.orbit.c{width:760px;height:360px;transform:translate(-50%,-50%) rotate(-8deg)}
.decorStar{position:absolute;color:#ff9bd2;text-shadow:0 0 10px #ff4aa5;animation:twinkle 1.8s infinite}
.ds1{left:24%;top:22%;font-size:15px}.ds2{right:25%;top:25%;font-size:12px;animation-delay:.4s}
.ds3{left:27%;top:68%;font-size:11px;animation-delay:.8s}.ds4{right:27%;top:70%;font-size:15px;animation-delay:1.2s}
.ds5{left:8%;top:39%;font-size:10px;animation-delay:.2s}.ds6{right:8%;top:38%;font-size:10px;animation-delay:1s}
.sparkle{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #ff75bf;animation:twinkle 2s infinite}
.sp1{left:20%;top:43%}.sp2{right:20%;top:45%;animation-delay:.5s}.sp3{left:38%;top:24%;animation-delay:1s}.sp4{right:38%;top:25%;animation-delay:1.5s}

.memory{
 position:absolute;width:104px;height:122px;cursor:pointer;
 transition:transform .25s,filter .25s;user-select:none
}
.memory:hover{transform:scale(1.08) translateY(-3px);filter:brightness(1.2)}
.photo{
 width:100%;height:92px;border:3px solid #fff;border-radius:5px;
 box-shadow:0 5px 18px rgba(0,0,0,.55),0 0 13px rgba(255,75,165,.3);
 overflow:hidden;position:relative;background:#222
}

.photo:before{content:"";position:absolute;inset:0}
.m1 .photo:before{background:linear-gradient(160deg,#ffd4e8 0 35%,#f19bb9 35% 58%,#7b315e 58% 100%);}.m1 .photo:after{content:"♥";position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);font-size:38px;color:#fff;text-shadow:0 2px 6px #7a1d4e}
.m2 .photo:before{background:linear-gradient(#ffb57d 0 38%,#ed7d86 38% 53%,#322b69 53% 100%);}.m2 .photo:after{content:"☀";position:absolute;right:12px;top:8px;font-size:28px;color:#fff6b0}
.m3 .photo:before{background:linear-gradient(#7acbff 0 47%,#1c6d9b 47% 62%,#0b3148 62% 100%);}.m3 .photo:after{content:"✦";position:absolute;left:50%;top:43%;font-size:35px;color:#fff}
.m4 .photo:before{background:linear-gradient(145deg,#f5e5d0,#d29b73 45%,#654038 46% 100%);}.m4 .photo:after{content:"☕";position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:35px}
.m5 .photo:before{background:linear-gradient(#261a4d 0 48%,#e48bca 48% 55%,#10101e 55% 100%);}.m5 .photo:after{content:"★";position:absolute;left:50%;top:34%;font-size:31px;color:#ffe8ff}
.m6 .photo:before{background:linear-gradient(#ffb9d8,#fff0c5 55%,#9bcfbd 56%);}.m6 .photo:after{content:"∞";position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:42px;color:#fff}
.caption{text-align:center;margin-top:7px;font-size:8px;font-weight:bold;letter-spacing:.4px;color:#ffe0f1;text-shadow:0 0 7px #ff4ca5}


.m1{left:7%;top:17%}.m2{right:7%;top:17%}
.m3{left:4%;top:48%}.m4{right:4%;top:48%}
.m5{left:16%;top:73%}.m6{right:16%;top:73%}
.extra{width:78px;height:94px}.extra .photo{height:67px}.extra .caption{font-size:6px}
.e1{left:31%;top:12%;transform:rotate(-7deg)}.e2{right:31%;top:12%;transform:rotate(7deg)}
.e1 .photo:before{background:linear-gradient(135deg,#ffc2dd,#b66c9d,#3d174b)}.e1 .photo:after{content:"♡";position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:30px;color:white}
.e2 .photo:before{background:linear-gradient(#ffd4a8,#f7a6c9,#6f467f)}.e2 .photo:after{content:"✿";position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:26px;color:white}


#message{
 position:absolute;z-index:80;left:50%;bottom:6%;transform:translate(-50%,20px);
 width:min(390px,82vw);padding:12px 18px;text-align:center;
 background:rgba(12,0,15,.95);border:1px solid #ff4ca0;border-radius:12px;
 box-shadow:0 0 24px rgba(255,45,150,.35);opacity:0;pointer-events:none;transition:.35s
}
#message.show{opacity:1;transform:translate(-50%,0)}
#message .msg{font-size:10px;line-height:1.45;color:#fff}
#message .close{margin-top:8px;padding:6px 14px;font-size:7px}
#hint{position:absolute;z-index:60;left:50%;top:8%;transform:translateX(-50%);font-size:7px;color:#e8c7db;letter-spacing:.7px;text-shadow:0 0 7px #ff4ca0;white-space:nowrap}

@keyframes pulse{50%{transform:scale(1.1)}} @keyframes twinkle{50%{opacity:.2;transform:scale(.5)}}
@keyframes heartBeat{50%{transform:translate(-50%,-43%) rotate(-45deg) scale(1.09);filter:brightness(1.15)}}
@media(max-width:650px){
 .memory{width:88px;height:105px}.photo{height:78px}.caption{font-size:7px}
 .m1{left:3%;top:16%}.m2{right:3%;top:16%}.m3{left:1%;top:47%}.m4{right:1%;top:47%}.m5{left:8%;top:73%}.m6{right:8%;top:73%}
 #core{transform:translate(-50%,-50%) scale(.86)}
}
</style>
</head>
<body>
<div id="app">
<canvas id="stars"></canvas>
<div id="intro" class="panel">
 <div class="heartMini">♥</div>
 <h1>Feliz día de la novia<br>mi amor</h1>
 <button id="start">CLICK AQUÍ MI AMOR</button>
</div>

<div id="loader" class="panel">
 <div class="loadtxt">Preparando nuestro universo..</div>
 <div class="bar"><i id="fill"></i></div>
</div>

<div id="scene">
 <div id="hint">TOCÁ CADA RECUERDO ❤️</div>
 <div id="keyboard"></div>
 <div id="decor">
  <div class="orbit a"></div><div class="orbit b"></div><div class="orbit c"></div>
  <span class="decorStar ds1">✦</span><span class="decorStar ds2">✧</span>
  <span class="decorStar ds3">✦</span><span class="decorStar ds4">✧</span>
  <span class="decorStar ds5">✦</span><span class="decorStar ds6">✦</span>
  <i class="sparkle sp1"></i><i class="sparkle sp2"></i><i class="sparkle sp3"></i><i class="sparkle sp4"></i>
 </div>

 <div id="memories">
  <div class="memory m1" data-msg="Desde que llegaste a mi vida, toda vida se volvio perfecta, como sos vos cada vez q veo esos ojos hermosos.❤️">
   <div class="photo"></div><div class="caption">Mi amor</div>
  </div>
  <div class="memory m2" data-msg="esa sonrisa hermosa q me enamora cada dia cada vez q la veo ojala hacerte reir todos los dias asi puedo verla todos los dias y guardarmela para nunca olvidarla. ☀️">
   <div class="photo"></div><div class="caption">Tu sonrisa</div>
  </div>
  <div class="memory m3" data-msg="no importa donde este por donde estas como me sienta q mi lugar favorita va ser siempre tus brazos y tus besos hermosos q me enamoran cada dia mas. ✨">
   <div class="photo"></div><div class="caption">Nuestro lugar</div>
  </div>
  <div class="memory m4" data-msg="me encanta cada momento q estube, estoy y estare con vos aunque sea lo mas pelotudo o aburrido para mi es mi favorito porque es con vos y con vos todo es mejor. ☕">
   <div class="photo"></div><div class="caption">Momentos</div>
  </div>
  <div class="memory m5" data-msg="cada noche q no puedo dormir por una pelea o algo q paso entre nosotros siempre me quedo mirando el arriba pensando en vos y en todos las lindas noches q vivimos los dos aunque sea a distancia. 🌙">
   <div class="photo"></div><div class="caption">Mis noches</div>
  </div>
  <div class="memory m6" data-msg="todo esto es tan perfecto y lindo, aunque hayan peleas o discuciones no me importan porque nunca voy a separarme de la mujer q mas amo todo esto va ser para siempre bebe acordate de esto. ∞">
   <div class="photo"></div><div class="caption">Para siempre</div>
  </div>
  <div class="memory extra e1" data-msg="Cada pequeño detalle q me haces cada cosa minima hasta un beso o hasta tus cartas q amo me enamora y mucho y me encanta igual q vos me encanta cada cosa q me hiciste cada beso cada risa q me sacaste me encanta todos tus detalles bbe te amo. 💗">
   <div class="photo"></div><div class="caption">Detalles</div>
  </div>
  <div class="memory extra e2" data-msg="gracias por todos estos recuerdos hermosos q vivi con vos me encanto cada segundo cada minuto cada hora gracias por siempre estar te amo demasiado bbe. 🌷">
   <div class="photo"></div><div class="caption">Recuerdos</div>
  </div>
 </div>

 <div id="core">
  <div class="coreGlow"></div>
  <div class="heart3d" id="heart"><div class="heartshine"></div></div>
  <div class="coreTitle">MI UNIVERSO</div>
  <div class="coreSub">TODO LO QUE SIENTO POR VOS TE AMOOOOOOOOOOOOOOOOOOOOOOO</div>
 </div>
</div>

<div id="message"><div class="msg" id="msgText"></div><button class="close" id="close">CERRAR</button></div>
</div>

<script>
const intro=document.getElementById('intro'),loader=document.getElementById('loader'),fill=document.getElementById('fill');
const scene=document.getElementById('scene'),message=document.getElementById('message'),msgText=document.getElementById('msgText');
function showMessage(t){msgText.textContent=t;message.classList.add('show')}
document.querySelectorAll('.memory').forEach(m=>m.addEventListener('click',()=>showMessage(m.dataset.msg)));
document.getElementById('heart').addEventListener('click',()=>showMessage('Sos el amor de mi vida. Gracias por hacer que mi mundo sea mucho más lindo. Te amo con todo mi corazón. ❤️'));
document.getElementById('close').addEventListener('click',()=>message.classList.remove('show'));

document.getElementById('start').onclick=()=>{
 intro.style.opacity='0';intro.style.pointerEvents='none';loader.style.display='block';
 let n=0;const timer=setInterval(()=>{n+=2.5;fill.style.width=n+'%';if(n>=100){clearInterval(timer);loader.style.opacity='0';setTimeout(()=>{loader.style.display='none';scene.classList.add('on')},500)}},55);
};

const c=document.getElementById('stars'),ctx=c.getContext('2d');let w,h,pts=[];
function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;
 pts=Array.from({length:650},()=>({x:(Math.random()-.5)*2.2,y:(Math.random()-.5)*1.5,z:Math.random()*.98+.02}))}
function draw(){ctx.clearRect(0,0,w,h);const cx=w/2,cy=h*.45;
 for(const p of pts){p.z-=.0011;if(p.z<.025){p.z=1;p.x=(Math.random()-.5)*2.2;p.y=(Math.random()-.5)*1.5}
  const k=360/p.z,x=cx+p.x*k*devicePixelRatio,y=cy+p.y*k*devicePixelRatio;
  if(x<0||x>w||y<0||y>h)continue;
  const r=Math.max(.35,(1-p.z)*1.9)*devicePixelRatio;
  ctx.fillStyle=`rgba(255,${190+Math.random()*65},${230+Math.random()*25},${Math.min(1,(1-p.z)*1.4)})`;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
 }
 requestAnimationFrame(draw)}
resize();addEventListener('resize',resize);draw();
</script>
</body>
</html>
